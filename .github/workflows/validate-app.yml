name: Validate recovered app

on:
  push:
    branches: [main]
    paths:
      - "recovered-source/**"
      - ".github/workflows/validate-app.yml"
  pull_request:
    paths:
      - "recovered-source/**"
      - ".github/workflows/validate-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recovered-source
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run lint
      - name: Build application
        run: npm run build
